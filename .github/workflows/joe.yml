# Starts at 6:43am IST (01:13 UTC) so the work — fetching, reading, generating — is done early.
# send.py waits internally until exactly 7:00am IST before sending anything to Telegram.

name: Joe morning digest

on:
  schedule:
    - cron: '13 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -r joeknowsball/requirements.txt

      - name: Run Joe
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python joeknowsball/send.py

      - name: Commit sent.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add joeknowsball/sent.json
          if git diff --cached --quiet; then
            echo "sent.json unchanged, skipping commit"
          else
            git commit -m "joe: update sent links"
            git push
          fi
